name: CI

# Enforces the build + verify gate that was previously "local only".
# Runs `npm test` (= build && verify && test:unit):
#   - Style Dictionary build produces all six dist/ outputs
#   - verify-build.mjs checks each exists & is non-empty
#   - the transform unit tests (scripts/lib/*.test.mjs) run
#   - the consumer contract (site var(--<prefix>-…) ↔ dist) runs when the site
#     repo is present; on this pipeline-only checkout it is skipped with a
#     warning (see verify-build.mjs). To enforce the contract too, run it
#     from the site repo's CI against the pinned tokens.
#
# Then checks that the committed dist/ matches what the build just produced,
# so a stale published artifact can't sail through. dist/report.html is excluded:
# its content depends on the site repo, which isn't checked out here.

on:
  pull_request:
    branches:
      - main
    # `edited` is here so a PR that gets RETARGETED onto main picks up the gate.
    # A stacked PR (base = another feature branch) never matches `branches: main`,
    # so no check is queued. When its base branch merges, GitHub retargets it to
    # main — but that emits `edited`, which is not one of the default types
    # (opened, synchronize, reopened). Without this the PR sits BLOCKED on a
    # required check that will never run, and the only way out is to close and
    # reopen it. Cost: `edited` also fires on title/body edits, so an occasional
    # redundant run — the job takes ~15s.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

jobs:
  test:
    name: build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build + verify
        run: npm test

      - name: Committed dist/ is up to date
        run: |
          if ! git diff --exit-code -- dist/light dist/dark tokens/snapshot.json tokens/changelog.json; then
            echo "::error::The build changed committed output. Run 'npm run build' and commit the result."
            exit 1
          fi
